name: Update profile images

on:
  schedule:
    - cron: "0 0 * * *"      # daily, 00:00 UTC (GitHub may delay it)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "profile.json"
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-images
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Renders character-card.svg, terminal.svg and app-console.svg.
      # --no-readme keeps the working tree clean: README.md is generated
      # locally and committed by you, not by CI.
      - name: Build SVG panels
        run: python3 scripts/build.py --out dist --no-readme
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
